spring.application.name=demo-test

# Server
server.port=${PORT:9090}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true

# Scalar
scalar.enabled=true
scalar.url=/api-docs
scalar.path=/api-docs-scalar
scalar.dark-mode=true
scalar.page-title=Demo API Documentation

# JWT
jwt.secret=${JWT_SECRET:change-this-demo-secret-key-minimum-32-characters-long}
jwt.expiration-ms=3600000

# Seeded admin account
app.admin.name=Admin
app.admin.email=${ADMIN_EMAIL:admin@demo.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
